name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'web-app/**'
      - 'core/**'
      - 'extensions/**'
      - 'src-tauri/**'
      - '.github/workflows/jan-unit-tests.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'vitest.config.ts'

  pull_request:
    branches:
      - main
      - dev
      - release/**

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  CARGO_TERM_COLOR: always

jobs:
  # TypeScript/JavaScript Unit Tests
  ts-unit-tests:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core

      - name: Run Core tests
        run: yarn workspace @janhq/core test

      - name: Run Core tests with coverage
        run: yarn workspace @janhq/core test:coverage

      - name: Upload Core coverage
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core/coverage/
          retention-days: 7

  web-app-tests:
    name: Web App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          yarn build:extensions-web

      - name: Run Web App tests
        run: yarn workspace @janhq/web-app test

      - name: Run Web App tests with coverage
        run: yarn workspace @janhq/web-app test:coverage

      - name: Upload Web App coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-app-coverage
          path: web-app/coverage/
          retention-days: 7

  # Extension Unit Tests
  extension-tests:
    name: Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extension:
          - opencog-extension
          - llamacpp-extension
          - assistant-extension
          - conversational-extension
          - download-extension
          - rag-extension
          - vector-db-extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          cd extensions && yarn install

      - name: Build extension
        working-directory: extensions/${{ matrix.extension }}
        run: yarn build
        continue-on-error: true

      - name: Check for test files
        id: check-tests
        working-directory: extensions/${{ matrix.extension }}
        run: |
          if find . -name "*.test.ts" -o -name "*.spec.ts" | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        working-directory: extensions/${{ matrix.extension }}
        run: npx vitest run --passWithNoTests
        continue-on-error: true

  # Rust Unit Tests
  rust-unit-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust tests (Main App)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- --test-threads=1

      - name: Run Rust tests (Utils)
        run: cargo test --manifest-path src-tauri/utils/Cargo.toml

      - name: Run Rust tests (Hardware Plugin)
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-hardware/Cargo.toml

      - name: Run Rust tests (LlamaCpp Plugin)
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-llamacpp/Cargo.toml

      - name: Run Rust tests (Vector DB Plugin)
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-vector-db/Cargo.toml
        continue-on-error: true

      - name: Run Rust tests (RAG Plugin)
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-rag/Cargo.toml
        continue-on-error: true

  # Rust Linting
  rust-lint:
    name: Rust Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- -D warnings
        continue-on-error: true

  # Coverage Summary
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [ts-unit-tests, web-app-tests]
    if: always()
    steps:
      - name: Download Core coverage
        uses: actions/download-artifact@v4
        with:
          name: core-coverage
          path: core-coverage
        continue-on-error: true

      - name: Download Web App coverage
        uses: actions/download-artifact@v4
        with:
          name: web-app-coverage
          path: web-app-coverage
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "## Unit Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core | ${{ needs.ts-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | ${{ needs.web-app-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
