name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'web-app/**'
      - 'core/**'
      - 'extensions/**'
      - 'e2e/**'
      - '.github/workflows/jan-e2e-tests.yml'
      - 'package.json'
      - 'yarn.lock'

  pull_request:
    branches:
      - main
      - dev
      - release/**
    paths:
      - 'web-app/**'
      - 'core/**'
      - 'extensions/**'
      - 'e2e/**'
      - '.github/workflows/jan-e2e-tests.yml'
      - 'package.json'
      - 'yarn.lock'

  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  e2e-chromium:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          yarn build:extensions-web
          yarn workspace @janhq/web-app build:web

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          yarn install
          npx playwright install chromium --with-deps

      - name: Run E2E tests (Chromium)
        working-directory: e2e
        run: yarn test:chromium
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-firefox:
    name: E2E Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          yarn build:extensions-web
          yarn workspace @janhq/web-app build:web

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          yarn install
          npx playwright install firefox --with-deps

      - name: Run E2E tests (Firefox)
        working-directory: e2e
        run: yarn test:firefox
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-firefox-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-webkit:
    name: E2E Tests (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          yarn build:extensions-web
          yarn workspace @janhq/web-app build:web

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          yarn install
          npx playwright install webkit --with-deps

      - name: Run E2E tests (WebKit)
        working-directory: e2e
        run: yarn test:webkit
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-mobile:
    name: E2E Tests (Mobile Viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install
          yarn build:core
          yarn build:extensions-web
          yarn workspace @janhq/web-app build:web

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          yarn install
          npx playwright install chromium webkit --with-deps

      - name: Run E2E tests (Mobile)
        working-directory: e2e
        run: yarn test:mobile
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-chromium, e2e-firefox, e2e-webkit, e2e-mobile]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium | ${{ needs.e2e-chromium.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firefox | ${{ needs.e2e-firefox.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WebKit | ${{ needs.e2e-webkit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile | ${{ needs.e2e-mobile.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check all tests passed
        if: needs.e2e-chromium.result != 'success' || needs.e2e-firefox.result != 'success' || needs.e2e-webkit.result != 'success' || needs.e2e-mobile.result != 'success'
        run: exit 1
