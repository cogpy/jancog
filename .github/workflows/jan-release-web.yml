name: Release Web App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      deploy:
        description: 'Deploy after build'
        required: false
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - 'web-app/**'
      - 'core/**'
      - 'extensions-web/**'
      - '.github/workflows/jan-release-web.yml'

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./web-app/package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: yarn install

      - name: Build Core
        run: yarn build:core

      - name: Build Extensions Web
        run: yarn build:extensions-web

      - name: Build Web App
        run: yarn workspace @janhq/web-app build:web
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Run Tests
        run: yarn workspace @janhq/web-app test

      - name: Create build artifacts
        run: |
          cd web-app
          tar -czvf jan-web-${{ steps.version.outputs.version }}.tar.gz dist-web/
          zip -r jan-web-${{ steps.version.outputs.version }}.zip dist-web/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-app-build
          path: |
            web-app/dist-web/
            web-app/jan-web-*.tar.gz
            web-app/jan-web-*.zip
          retention-days: 30

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-web]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.deploy)
    environment:
      name: staging
      url: https://staging.jan.ai
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-app-build
          path: ./build

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here
          # Examples:
          # - AWS S3: aws s3 sync ./build/dist-web s3://staging-bucket
          # - Vercel: vercel deploy --prod
          # - Netlify: netlify deploy --prod --dir=./build/dist-web

      - name: Notify deployment
        if: always()
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-web.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.deploy
    environment:
      name: production
      url: https://jan.ai
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-app-build
          path: ./build

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here

      - name: Notify deployment
        if: always()
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-web.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Docker Image Build
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-app-build
          path: ./web-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/jan-web:${{ needs.build-web.outputs.version }}
            ghcr.io/${{ github.repository }}/jan-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
